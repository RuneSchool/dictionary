<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etymological Spelling System Translator</title>
    <meta property="og:title" content="Etymological Spelling System Translator">
    <meta property="og:site_name" content="Etymological Spelling System Translator">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>
        if (window.matchMedia('(prefers-color-scheme: dark)').media === 'not all') {
            document.documentElement.style.display = 'none';
            document.head.insertAdjacentHTML(
                'beforeend',
                '<link rel="stylesheet" href="/light.css" onload="document.documentElement.style.display = \'\'">'
            );
        }
    </script>

    <link rel="stylesheet" href="css/dark.css" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="css/light.css" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="css/style-etym.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/fontawesome.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/solid.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">

    <script src="js/translate-etym.js" defer></script>
</head>

<body>
    <h1>Etymological Spelling System Translator</h1>

    <div class="translation_container">
        <label for="latinInput">Enter regular English text:</label>
        <textarea id="latinInput" rows="5"></textarea>

        <div class="button_row">
            <button id="translateButton" disabled>Loading Dictionary...</button>
            <button id="asciiToggle" type="button" aria-pressed="false">See ASCII</button>
        </div>

        <label>Etymological Translation:</label>
        <div id="etymOutput" class="output_box"></div>
    </div>
</body>
</html>
